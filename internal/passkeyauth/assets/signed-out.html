<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 Not Found</title>
    <link rel="stylesheet" href="/auth/auth.css" />
    <script defer src="/auth/auth.js"></script>
  </head>
  <body data-page="login">
    <main class="auth-card">
      <p class="auth-code" aria-hidden="true">404</p>
      <h1>Nothing here</h1>
      <p class="auth-lead">
        This page wandered off without leaving a note. We checked under the
        sofa. Twice.
      </p>
      <button id="passkey" class="auth-button quiet" type="button">
        Sign in
      </button>
      <p
        id="auth-status"
        class="auth-status"
        role="status"
        aria-live="polite"
      ></p>
    </main>
  </body>
</html>
