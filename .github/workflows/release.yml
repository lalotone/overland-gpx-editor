name: Release

# Tagging is the trigger:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag is also the version — the Makefile stamps it into the binary with
# git describe, so `overland --version` reports what was released.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # to create the release and upload the archives

jobs:
  mobile-tests:
    uses: ./.github/workflows/mobile.yml

  release:
    needs: mobile-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git describe needs the tags, and a shallow clone has none.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            mobile/go.sum

      # A tag should never publish something that fails its own checks. This
      # is the same command a contributor runs locally.
      - name: Check
        run: make check

      # Writes .deb and .rpm without dpkg or rpmbuild being present, which is
      # what keeps everything on this one runner. Pinned so a release is not
      # at the mercy of whatever @latest resolves to that day.
      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Desktop targets are pure Go, so this one Linux runner produces the macOS
      # and Windows builds too — no cross-toolchain, no matrix, no mac runner.
      - name: Build archives and packages
        run: make dist

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Prepare Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            umask 077
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/overland-release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/overland-release.jks" >> "$GITHUB_ENV"
          fi
      # make dist clears build/, so assemble the APK afterwards.
      - name: Build Android release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" make android-release
      - name: Add APK checksums
        working-directory: build/android
        run: sha256sum -- *.apk >> ../SHA256SUMS
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/overland-release.jks"

      - name: Write release notes
        run: |
          cat > build/NOTES.md <<'NOTES'
          ### Install

          Download the archive for your platform, unpack it, and run the
          binary. It serves the whole app — frontend, API and track library —
          on <http://localhost:8000>, with nothing else to install.

          ```bash
          tar xzf gpx-editor-linux-amd64.tar.gz
          cd gpx-editor-linux-amd64
          ./overland serve
          ```

          On Debian, Ubuntu, Fedora or RHEL there are packages instead:

          ```bash
          sudo apt install ./gpx-editor_*_amd64.deb     # or
          sudo dnf install ./gpx-editor-*.x86_64.rpm
          ```

          They install `/usr/bin/overland` and drop an example systemd unit
          in `/usr/share/doc/gpx-editor/` — deliberately not registered, since
          the user and library directory are yours to choose.

          **macOS** — the binaries are unsigned, so Gatekeeper quarantines
          them. Clear it once with `xattr -dr com.apple.quarantine ./overland`,
          or right-click the binary and choose Open.

          **Windows** — SmartScreen warns about an unrecognised app for the
          same reason: More info, then Run anyway.

          **Android (ARM64)** — download `overland-release.apk` and install it:

          ```bash
          adb install -r overland-release.apk
          ```

          Installing with `-r` preserves existing tracks and offline downloads.

          Verify a download against `SHA256SUMS`:

          ```bash
          sha256sum -c SHA256SUMS --ignore-missing
          ```
          NOTES

      # --generate-notes appends the commit changelog after the notes above.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file build/NOTES.md \
            --generate-notes \
            build/*.tar.gz build/*.zip build/*.deb build/*.rpm build/android/*.apk build/SHA256SUMS
