name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: mobile/go.mod
          cache-dependency-path: |
            go.sum
            mobile/go.sum

      - run: npm ci
      - name: Type-check and build mobile frontend
        run: npm run build:mobile
      - name: Test mobile Go packages
        run: go -C mobile test -race -cover ./host/... ./frontend/... ./cmd/preview/...
      - name: Vet mobile Go packages
        run: go -C mobile vet ./host/... ./frontend/... ./cmd/preview/...
      - run: npx playwright install --with-deps chromium
      - name: Test mobile UI at both phone sizes
        run: npm run test:mobile -- --forbid-only --reporter=line
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-results
          path: test-results/mobile/
          if-no-files-found: ignore
          retention-days: 7
